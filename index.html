  <style>

  <script>
    const screen = document.getElementById("screen");
    const scene = document.getElementById("scene");
    const movingLayers = [];

    let designScale = 0.35;

    const layerSettings = [
      {
        file: "1.png",
        direction: 1,
        speed: 500,
        smallGapMin: -50,
        smallGapMax: 80,
        largeGapMin: 120,
        largeGapMax: 200,
        largeGapChance: 0.3
      },
      {
        file: "2.png",
        direction: -1,
        speed: 420,
        smallGapMin: 20,
        smallGapMax: 80,
        largeGapMin: 200,
        largeGapMax: 300,
        largeGapChance: 0.3
      },
      { title: "THE" },
      {
        file: "6.png",
        direction: 1,
        speed: 500,
        smallGapMin: -15,
        smallGapMax: 90,
        largeGapMin: 80,
        largeGapMax: 150,
        largeGapChance: 0.5
      },
      {
        file: "7.png",
        direction: -1,
        speed: 500,
        smallGapMin: 10,
        smallGapMax: 60,
        largeGapMin: 100,
        largeGapMax: 150,
        largeGapChance: 0.5
      },
      {
        file: "11.png",
        direction: 1,
        speed: 550,
        smallGapMin: 10,
        smallGapMax: 90,
        largeGapMin: 130,
        largeGapMax: 180,
        largeGapChance: 0.35
      }
    ];

    function resizeScene() {
      designScale = 0.35 * (screen.clientWidth / 790);
      scene.style.transform = `scale(${designScale})`;

      movingLayers.forEach((layer) => {
        if (layer.image.naturalWidth) {
          buildLayer(layer);
        }
      });
    }

    function getRandomGap(layer) {
      const useLargeGap = Math.random() < layer.largeGapChance;

      const min = useLargeGap ? layer.largeGapMin : layer.smallGapMin;
      const max = useLargeGap ? layer.largeGapMax : layer.smallGapMax;
      const visibleGap = min + Math.random() * (max - min);

      return visibleGap / designScale;
    }

    function createTile(layer, y) {
      const tile = document.createElement("div");
      tile.className = "tile";

      const img = document.createElement("img");
      img.src = layer.file;
      img.alt = "";
      img.draggable = false;

      tile.appendChild(img);
      layer.cell.appendChild(tile);

      return { element: tile, y };
    }

    function buildLayer(layer) {
      if (!layer.image.naturalWidth) return;

      const width = layer.cell.clientWidth;
      if (!width) return;

      layer.cell.replaceChildren();

layer.dropWords.forEach((word) => {
  layer.cell.appendChild(word);
});

layer.tiles = [];

      layer.imageHeight =
        width * (layer.image.naturalHeight / layer.image.naturalWidth);

      layer.distanceSinceSpawn = 0;

      const buffer = Math.max(
        layer.imageHeight * 2,
        layer.cell.clientHeight * 0.35
      );

      if (layer.direction === 1) {
        let y = 0;

        while (y < layer.cell.clientHeight + buffer) {
          layer.tiles.push(createTile(layer, y));
          y += layer.imageHeight + getRandomGap(layer);
        }
      } else {
        let y = layer.cell.clientHeight - layer.imageHeight;

        while (y + layer.imageHeight > -buffer) {
          layer.tiles.push(createTile(layer, y));
          y -= layer.imageHeight + getRandomGap(layer);
        }
      }

      layer.nextSpawnDistance =
  layer.imageHeight * 0.8 + getRandomGap(layer);
    }

    layerSettings.forEach((setting) => {
      if (setting.title) {
        const title = document.createElement("div");
        title.className = "title-cell";
        title.textContent = setting.title;
        scene.appendChild(title);
        return;
      }

      const cell = document.createElement("div");
      cell.className = "photo-cell";
      scene.appendChild(cell);

      const layer = {
        file: setting.file,
        cell,
        direction: setting.direction,
        speed: setting.speed,
        smallGapMin: setting.smallGapMin,
        smallGapMax: setting.smallGapMax,
        largeGapMin: setting.largeGapMin,
        largeGapMax: setting.largeGapMax,
        largeGapChance: setting.largeGapChance,
        image: new Image(),
        imageHeight: 0,
        tiles: [],
        dropWords: [],
        dropStep: 0
      };

      if (setting.file === "1.png") {
  cell.classList.add("drop-hover-cell");

  const word = document.createElement("div");
  word.className = "drop-word";

  ["D", "R", "O", "P"].forEach((letter) => {
    const line = document.createElement("span");
    line.textContent = letter;
    word.appendChild(line);
  });

  const secondWord = word.cloneNode(true);
  layer.dropWords = [word, secondWord];

  layer.dropWords.forEach((item) => {
    cell.appendChild(item);
  });

  // 다음 DROP은 앞 글자와 같은 간격으로 이어지게 배치
  layer.dropStep = word.offsetHeight + 120;

  cell.addEventListener("mouseenter", () => {
    layer.dropWords.forEach((item, index) => {
      item.dropY = index === 0 ? 0 : -layer.dropStep;
      item.style.transform = `translate3d(0, ${item.dropY}px, 0)`;
    });
  });
}

      movingLayers.push(layer);

      layer.image.onload = () => buildLayer(layer);
      layer.image.src = layer.file;
    });

    resizeScene();
    window.addEventListener("resize", resizeScene);

    let previousTime = 0;

    function animate(time) {
      const deltaTime =
        previousTime === 0
          ? 0
          : Math.min((time - previousTime) / 1000, 0.05);

      previousTime = time;

      movingLayers.forEach((layer) => {
        if (!layer.imageHeight || layer.tiles.length === 0) return;

        const distance =
          (layer.speed * deltaTime) / designScale;

          if (layer.dropWords.length && layer.cell.matches(":hover")) {
  layer.dropWords.forEach((word) => {
    word.dropY += distance;
  });

  layer.dropWords.forEach((word) => {
    if (word.dropY > layer.cell.clientHeight) {
      const topY = Math.min(
        ...layer.dropWords.map((item) => item.dropY)
      );

      word.dropY = topY - layer.dropStep;
    }

    word.style.transform =
      `translate3d(0, ${word.dropY}px, 0)`;
  });
}

        layer.tiles.forEach((tile) => {
          tile.y += layer.direction * distance;
        });

        layer.distanceSinceSpawn += distance;

        while (layer.distanceSinceSpawn >= layer.nextSpawnDistance) {
          layer.distanceSinceSpawn -= layer.nextSpawnDistance;

          const newY =
            layer.direction === 1
              ? layer.distanceSinceSpawn
              : layer.cell.clientHeight -
                layer.imageHeight -
                layer.distanceSinceSpawn;

          layer.tiles.push(createTile(layer, newY));

          layer.nextSpawnDistance =
            layer.imageHeight + getRandomGap(layer);
        }

        layer.tiles = layer.tiles.filter((tile) => {
          const isOffscreen =
            layer.direction === 1
              ? tile.y >= layer.cell.clientHeight
              : tile.y + layer.imageHeight <= 0;

          if (isOffscreen) tile.element.remove();
          return !isOffscreen;
        });

        layer.tiles.forEach((tile) => {
          tile.element.style.transform =
            `translate3d(0, ${tile.y}px, 0)`;
        });
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
    
   function alignClickTiles() {
  const stage = document.querySelector(".editor-stage");
  const clickLine = document.querySelector(".phrase-click");
  const clickWord = clickLine?.querySelector("span:first-child");
  const tilesLine = document.querySelector(".phrase-tiles");
  const tilesToLine = document.querySelector(".phrase-tiles-to");
  const beatLine = document.querySelector(".phrase-beat");

  if (
    !stage ||
    !clickLine ||
    !clickWord ||
    !tilesLine ||
    !tilesToLine ||
    !beatLine ||
    clickLine.getClientRects().length === 0
  ) return;

  const clickStyle = getComputedStyle(clickLine);
  const tilesStyle = getComputedStyle(tilesLine);

function createStackBacking(
  events,
  landingTopByEvent,
  fillColor = "#000000",
  canvasTop = 0,
  canvasHeight = fallingLayer.clientHeight
) {
  const canvas = document.createElement("canvas");
  canvas.className = "stack-backing";

  const width = Math.ceil(fallingLayer.clientWidth);
  const height = Math.max(1, Math.ceil(canvasHeight));

  canvas.width = width;
  canvas.height = height;

  canvas.style.inset = "auto";
  canvas.style.left = "0px";
  canvas.style.top = `${canvasTop}px`;
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;

  if (events.length === 0 || width === 0) {
    return canvas;
  }

  const context = canvas.getContext("2d");
  const padding = 24;

  const boxes = events
    .map((item) => {
      const x = (item.leftPercent / 100) * width;
      const y = landingTopByEvent.get(item) - canvasTop;

      return {
        left: Math.max(0, x - padding),
        top: Math.max(0, y - padding),
        right: Math.min(width, x + item.width + padding),
        bottom: Math.min(height, y + item.height + padding)
      };
    })
    .filter((box) => box.right > box.left && box.bottom > box.top);

  if (boxes.length === 0) {
    return canvas;
  }

  const rows = [];

  for (let y = 0; y < height; y++) {
    const activeBoxes = boxes.filter(
      (box) => box.top < y + 1 && box.bottom > y
    );

    if (activeBoxes.length === 0) continue;

    rows.push({
      y,
      left: Math.min(...activeBoxes.map((box) => box.left)),
      right: Math.max(...activeBoxes.map((box) => box.right))
    });
  }

  context.fillStyle = fillColor;

  rows.forEach((row, index) => {
    context.fillRect(row.left, row.y, row.right - row.left, 1);

    const nextRow = rows[index + 1];
    if (!nextRow || nextRow.y <= row.y + 1) return;

    const gap = nextRow.y - row.y;

    for (let y = row.y + 1; y < nextRow.y; y++) {
      const progress = (y - row.y) / gap;
      const left = row.left + (nextRow.left - row.left) * progress;
      const right = row.right + (nextRow.right - row.right) * progress;

      context.fillRect(left, y, right - left, 1);
    }
  });

  return canvas;
}

  function getExpandedCompositionBounds() {
    const sourceWidth = Math.max(1, stage.clientWidth);

    const padding = 24;
    const boxes = lastPlayedEvents.map((item) => {

      const y = lastLandingTopByEvent.get(item);

      return {
        left: Math.max(0, x - padding),
        top: Math.max(0, y - padding),
        right: Math.min(sourceWidth, x + item.width + padding),
        bottom: Math.min(sourceHeight, y + item.height + padding)
      };
    });

    return {
      left: Math.min(...boxes.map((box) => box.left)),
      top: Math.min(...boxes.map((box) => box.top)),
      right: Math.max(...boxes.map((box) => box.right)),
      bottom: Math.max(...boxes.map((box) => box.bottom))
    };
  }

  function createCompactStackBacking(events, bounds, width, height) {
    const canvas = document.createElement("canvas");
    canvas.className = "stack-backing";
    canvas.width = Math.max(1, Math.ceil(width));
    canvas.height = Math.max(1, Math.ceil(height));
    canvas.style.inset = "auto";
    canvas.style.left = "0px";
    canvas.style.top = "0px";
    canvas.style.width = `${canvas.width}px`;
    canvas.style.height = `${canvas.height}px`;

    const context = canvas.getContext("2d");
    const padding = 24;
    const boxes = events.map((item) => {
      const x = (item.leftPercent / 100) * stage.clientWidth;
      const y = lastLandingTopByEvent.get(item);

      return {
        left: Math.max(0, x - padding - bounds.left),
        top: Math.max(0, y - padding - bounds.top),
        right: Math.min(canvas.width, x + item.width + padding - bounds.left),
        bottom: Math.min(canvas.height, y + item.height + padding - bounds.top)
      };
    });

    const rows = [];
    for (let y = 0; y < canvas.height; y++) {
      const activeBoxes = boxes.filter(
        (box) => box.top < y + 1 && box.bottom > y
      );
      if (activeBoxes.length === 0) continue;

      rows.push({
        y,
        left: Math.min(...activeBoxes.map((box) => box.left)),
        right: Math.max(...activeBoxes.map((box) => box.right))
      });
    }

    const context2d = context;
    context2d.fillStyle = "#000000";
    rows.forEach((row, index) => {
      context2d.fillRect(row.left, row.y, row.right - row.left, 1);
      const nextRow = rows[index + 1];
      if (!nextRow || nextRow.y <= row.y + 1) return;

      const gap = nextRow.y - row.y;
      for (let y = row.y + 1; y < nextRow.y; y++) {
        const progress = (y - row.y) / gap;
        const left = row.left + (nextRow.left - row.left) * progress;
        const right = row.right + (nextRow.right - row.right) * progress;
        context2d.fillRect(left, y, right - left, 1);
      }
    });

    return canvas;
  }

    const anchorLeft = bounds.left;

    const scale = Math.min(

    expandedLayout = {

    board.style.gridTemplateRows = `repeat(${resultRows}, ${cellHeight}px)`;
    board.style.transform = `scale(${scale})`;

          block.style.height = `${item.height}px`;
          block.style.zIndex = String(index + 1);
          block.style.transition = "none";
          cell.appendChild(block);

        board.appendChild(cell);

  }

  function playExpandedResult() {
    if (lastPlayedEvents.length === 0) return;

    isPlaying = true;

    const events = [...lastPlayedEvents].sort((a, b) => a.y - b.y);
    const firstY = events[0].y;
    const lastY = events[events.length - 1].y;
    const lastOffset = Math.max(0, ((lastY - firstY) / pixelsPerSecond) * 1000);
    const cycleDuration = lastOffset + 650;

    function playAudio(item) {
      const audio = new Audio(item.audioFile);
      playingAudios.push(audio);

      const removeAudio = () => {
        const index = playingAudios.indexOf(audio);
        if (index !== -1) playingAudios.splice(index, 1);
      };

      audio.addEventListener("ended", removeAudio, { once: true });
      audio.addEventListener("error", removeAudio, { once: true });
      audio.play().catch((error) => {
        removeAudio();
        console.warn(`${item.audioFile} 재생을 확인해줘.`, error);
      });
    }

    let lastScheduledDelay = 0;

    for (let row = 0; row < resultRows; row++) {
      for (let column = 0; column < resultColumns; column++) {
        events.forEach((item) => {
          const delay =
            row * cycleDuration +
            Math.max(0, ((item.y - firstY) / pixelsPerSecond) * 1000);

          lastScheduledDelay = Math.max(lastScheduledDelay, delay);
          const timerId = setTimeout(() => {
            if (isPlaying) playAudio(item);
          }, delay);
          timerIds.push(timerId);
        });
      }
    }

    const finishTimer = setTimeout(() => {
      if (isPlaying) stopPlayback(false, true);
    }, lastScheduledDelay + 1500);
    timerIds.push(finishTimer);
  }



  function startPlayback() {
    if (beatEvents.length === 0) return;
    resultRows = 1;
    resultColumns = 1;
    expandedLayout = null;
    gallery.classList.remove("result-ready");
    repeatButton.disabled = true;
gallery.classList.remove("repeat-active");

    isPlaying = true;
    gallery.classList.add("playback-active");
    playButton.textContent = "STOP";

    const startY = grayAreaTop();
    const lastEventY = Math.max(...beatEvents.map((item) => item.y));
    const lastEventTime =
      Math.max(0, (lastEventY - startY) / pixelsPerSecond);
    const stopAfter = lastEventTime + 1.5;

   fallingLayer.replaceChildren();
fallingLayer.style.display = "block";
fitFallingLayer();
beatEvents.forEach((item) => {
  item.element.style.display = "none";
});
    const orderedEvents = [...beatEvents].sort((a, b) => a.y - b.y);
   
const firstEvent = orderedEvents[0];
const lastEvent = orderedEvents[orderedEvents.length - 1];
const landingTopByEvent = new Map();

const edgePadding = 24;
const stackTop = grayAreaTop() + edgePadding;
const stackBottom = fallingLayer.clientHeight - edgePadding;
const timeSpan = lastEvent.y - firstEvent.y;
const availableGap = stackBottom - firstEvent.height - stackTop;

const gapScale =
  timeSpan > 0
    ? Math.max(0, availableGap / timeSpan)
    : 1;

orderedEvents.forEach((item) => {
  const distanceFromLast = lastEvent.y - item.y;

  landingTopByEvent.set(
    item,
    stackTop + distanceFromLast * gapScale
  );
});
lastPlayedEvents = orderedEvents.slice();
lastLandingTopByEvent = new Map(landingTopByEvent);

    const stackBacking = createStackBacking(
      orderedEvents,
      landingTopByEvent
    );

   fallingLayer.appendChild(stackBacking);

// 재생 시작 전에 악보 화면을 맨 아래로 이동
const previousScrollBehavior = scrollArea.style.scrollBehavior;
scrollArea.style.scrollBehavior = "auto";

scrollArea.scrollTop = Math.max(
  0,
  scrollArea.scrollHeight - scrollArea.clientHeight
);

requestAnimationFrame(() => {
  scrollArea.style.scrollBehavior = previousScrollBehavior;
});

// 악보가 화면보다 길 때만 맨 아래로 부드럽게 스크롤




    orderedEvents.forEach((item) => {
      const delay = Math.max(
        0,
        ((item.y - startY) / pixelsPerSecond) * 1000
      );

      const timerId = setTimeout(() => {
        if (!isPlaying) return;

        const dropBlock = new Image();
dropBlock.className = "falling-block";
dropBlock.src = item.file;
dropBlock.alt = "";
dropBlock.draggable = false;
dropBlock.style.left = `${item.leftPercent}%`;
dropBlock.style.width = `${item.width}px`;
dropBlock.style.height = `${item.height}px`;

const landingTop = landingTopByEvent.get(item);

dropBlock.style.top = `${scrollArea.scrollTop - item.height}px`;
fallingLayer.appendChild(dropBlock);

requestAnimationFrame(() => {
  dropBlock.style.transition =
     "top 0.8s ease-out";
  dropBlock.style.top = `${landingTop}px`;
});

const audio = new Audio(item.audioFile);
playingAudios.push(audio);
audio.play().catch((error) => {
  console.warn(`${item.audioFile} 재생을 확인해줘.`, error);
});

      }, delay);

      timerIds.push(timerId);
    });

    const lastDropDelay = Math.max(
      ...orderedEvents.map((item) =>
        Math.max(0, ((item.y - startY) / pixelsPerSecond) * 1000)
      )
    );

    const backingRevealTimer = setTimeout(() => {
      stackBacking.style.opacity = "1";
    }, lastDropDelay + 850);

    timerIds.push(backingRevealTimer);

    const startedAt = performance.now();


    function moveLineDuringPlayback(now) {
  if (!isPlaying) return;

  const elapsed = (now - startedAt) / 1000;

  if (elapsed >= stopAfter) {
    stopPlayback(true, true);
    return;
  }

  animationId = requestAnimationFrame(moveLineDuringPlayback);
}

animationId = requestAnimationFrame(moveLineDuringPlayback);
  }

  playButton.addEventListener("click", (event) => {
    event.stopPropagation();

    if (isPlaying) {
  stopPlayback(isRepeating ? false : true);
    } else if (resultRows > 1 || resultColumns > 1) {
      playExpandedResult();
} else {
      startPlayback();
    }
  });

  function addResultCopy(axis) {
    if (!gallery.classList.contains("result-ready")) return;

    // 재생 중 추가를 눌러도 기존 타이머와 소리가 남지 않게 정리한 뒤,
    // 늘어난 전체 구성을 처음부터 다시 재생해.
    if (isPlaying) {
      stopPlayback(false);
    }

    if (axis === "horizontal") {
      resultColumns += 1;
    } else {
      resultRows += 1;
    }

    renderExpandedResult();
    playExpandedResult();
  }

  expandRightButton.addEventListener("click", (event) => {
    event.stopPropagation();
    addResultCopy("horizontal");
  });

  expandDownButton.addEventListener("click", (event) => {
    event.stopPropagation();
    addResultCopy("vertical");
  });

  repeatButton.addEventListener("click", (event) => {
  event.stopPropagation();

  // 반복 중 버튼을 누르면 소리와 선만 멈춤. 블록과 사진은 남아 있음.
  if (isRepeating) {
    stopPlayback(false, true);
    return;
  }

  if (
    repeatButton.disabled ||
    lastPlayedEvents.length === 0
  ) {
    return;
  }

  // 확장된 블럭의 소리가 재생 중이어도 REPEAT를 누르면
  // 현재 재생을 멈추고 반사 반복으로 바로 전환해.
  if (isPlaying) {
    stopPlayback(false);
  }

  gallery.classList.remove("result-ready");

  // 전에 만든 반사 구간이 있으면 반복을 새로 시작할 때만 정리
  fallingLayer
    .querySelectorAll(".repeat-generated")
    .forEach((element) => element.remove());

  const repeatLandingTopByEvent = new Map();
  let events;

  if (expandedLayout) {
    events = [];
    const baseEvents = [...lastPlayedEvents].sort((a, b) => a.y - b.y);
    const {
      bounds,
      sourceWidth,
      cellWidth,
      cellHeight,
      scale,
      anchorLeft,
      anchorTop,
      rows,
      columns
    } = expandedLayout;

    for (let row = 0; row < rows; row++) {
      for (let column = 0; column < columns; column++) {
        baseEvents.forEach((item) => {
          const sourceX = (item.leftPercent / 100) * sourceWidth;
          const localX = sourceX - bounds.left;
          const localY = lastLandingTopByEvent.get(item) - bounds.top;
          const expandedItem = {
            ...item,
            leftPercent:
              ((anchorLeft + (column * cellWidth + localX) * scale) /
                Math.max(1, stage.clientWidth)) *
              100,
            width: item.width * scale,
            height: item.height * scale
          };
          const expandedTop =
            anchorTop + (row * cellHeight + localY) * scale;

          events.push(expandedItem);
          repeatLandingTopByEvent.set(expandedItem, expandedTop);
        });
      }
    }

    events.sort(
      (a, b) => repeatLandingTopByEvent.get(a) - repeatLandingTopByEvent.get(b)
    );
  } else {
    events = [...lastPlayedEvents].sort((a, b) => a.y - b.y);
    events.forEach((item) => {
      repeatLandingTopByEvent.set(item, lastLandingTopByEvent.get(item));
    });
  }

  const originalTop = Math.min(
    ...events.map((item) => repeatLandingTopByEvent.get(item))
  );

  const originalBottom = Math.max(
    ...events.map(
      (item) => repeatLandingTopByEvent.get(item) + item.height
    )
  );

const stackHeight = Math.max(1, originalBottom - originalTop);
const padding = 24;
const bandTop = originalBottom + padding;
const bottomMargin = grayAreaTop();
const contentTop = bandTop + padding;

const panelBottom =
  bandTop + stackHeight + padding * 2 + bottomMargin;

// 편집 영역보다 검은 배경이 짧아지지 않게 함
const stageHeight = Math.max(panelBottom, scrollArea.clientHeight);

stage.style.height = `${stageHeight}px`;
stage.style.minHeight = `${stageHeight}px`;
fitFallingLayer();

const bandHeight = fallingLayer.clientHeight - bandTop;


  // 원본 블록 바로 밑에 검은 배경을 한 번만 만듦
  const blackBand = document.createElement("div");
  blackBand.className = "repeat-black-half repeat-generated";
  blackBand.style.top = `${bandTop}px`;
  blackBand.style.height = `${bandHeight}px`;
  fallingLayer.appendChild(blackBand);

  const mirroredTops = new Map();

  events.forEach((item) => {
    const originalLocalTop =
      repeatLandingTopByEvent.get(item) - originalTop;

    const mirroredLocalTop =
      stackHeight - (originalLocalTop + item.height);

    mirroredTops.set(item, contentTop + mirroredLocalTop);
  });

  // 사진 바깥을 감싸는 블록만 흰색으로 만듦
  const whiteBacking = createStackBacking(
    events,
    mirroredTops,
    "#ffffff",
    bandTop,
    bandHeight
  );

  whiteBacking.classList.add("repeat-generated");
  whiteBacking.style.opacity = "1";
  whiteBacking.style.transition = "none";
  fallingLayer.appendChild(whiteBacking);

  // 사진은 원본 색을 유지하고, 위치와 세로 방향만 반사
  events.forEach((item) => {
    const mirroredImage = new Image();

    mirroredImage.className =
      "falling-block repeat-block repeat-generated";
    mirroredImage.src = item.file;
    mirroredImage.alt = "";
    mirroredImage.draggable = false;
    mirroredImage.style.left = `${item.leftPercent}%`;
    mirroredImage.style.width = `${item.width}px`;
    mirroredImage.style.height = `${item.height}px`;
    mirroredImage.style.top = `${mirroredTops.get(item)}px`;

    fallingLayer.appendChild(mirroredImage);
  });

  isPlaying = true;
  isRepeating = true;
  gallery.classList.remove("playback-active");
  gallery.classList.add("repeat-active");
  playButton.textContent = "PLAY";
repeatButton.textContent = "STOP";

  function scheduleRepeat(callback, delay) {
    let timerId = setTimeout(() => {
      const index = timerIds.indexOf(timerId);
      if (index !== -1) timerIds.splice(index, 1);

      if (!isPlaying || !isRepeating) return;
      callback();
    }, delay);

    timerIds.push(timerId);
  }

  function playEventAudio(item) {
    const audio = new Audio(item.audioFile);
    playingAudios.push(audio);

    const removeAudio = () => {
      const index = playingAudios.indexOf(audio);
      if (index !== -1) playingAudios.splice(index, 1);
    };

    audio.addEventListener("ended", removeAudio, { once: true });
    audio.addEventListener("error", removeAudio, { once: true });

    audio.play().catch((error) => {
      removeAudio();
      console.warn(`${item.audioFile} 재생을 확인해줘.`, error);
    });
  }

    const soundMarkers = [];

  events.forEach((item) => {
    soundMarkers.push({
      y: repeatLandingTopByEvent.get(item) + item.height / 2,
      item
    });

    soundMarkers.push({
      y: mirroredTops.get(item) + item.height / 2,
      item
    });
  });

  const sweepTop = Math.max(
    grayAreaTop(),
    originalTop - padding
  );

 const sweepBottom = panelBottom;

  function startSweep(direction) {
    if (!isPlaying || !isRepeating) return;

    const fromY = direction > 0 ? sweepTop : sweepBottom;
    const toY = direction > 0 ? sweepBottom : sweepTop;

    const markers = soundMarkers
      .filter((marker) =>
        marker.y >= sweepTop && marker.y <= sweepBottom
      )
      .sort((a, b) =>
        direction > 0 ? a.y - b.y : b.y - a.y
      );

    let markerIndex = 0;
    const startedAt = performance.now();
    const totalDistance = Math.abs(toY - fromY);

    setPlayhead(fromY);

    function moveLine(now) {
      if (!isPlaying || !isRepeating) {
        animationId = 0;
        return;
      }

      const elapsedSeconds = (now - startedAt) / 1000;
      const distance = Math.min(
        elapsedSeconds * pixelsPerSecond,
        totalDistance
      );

      const currentY = fromY + direction * distance;

      setPlayhead(currentY);


      // 반사 구간에서는 가로선을 흰색으로 표시
      gallery.classList.toggle(
        "repeat-on-black",
        currentY >= bandTop &&
          currentY <= bandTop + bandHeight
      );

      // 선이 사진 위치를 지날 때 해당 소리 재생
      while (markerIndex < markers.length) {
        const marker = markers[markerIndex];
        const reached =
          direction > 0
            ? marker.y <= currentY
            : marker.y >= currentY;

        if (!reached) break;

        playEventAudio(marker.item);
        markerIndex += 1;
      }

     const targetScrollTop =
  currentY - scrollArea.clientHeight * 0.5;

const maxScrollTop =
  scrollArea.scrollHeight - scrollArea.clientHeight;

scrollArea.scrollTop = Math.max(
  0,
  Math.min(targetScrollTop, maxScrollTop)
);

      if (distance >= totalDistance) {
        animationId = 0;
        startSweep(-direction);
        return;
      }

      animationId = requestAnimationFrame(moveLine);
    }

    animationId = requestAnimationFrame(moveLine);
  }

  // 원본 구간부터 재생하고, 반사 구간과 번갈아 계속 반복
  startSweep(-1);
});
})();
</script>
